name: P5 P6 candidate source and host contracts
on:
  push:
    branches: [p5, p6]
  pull_request:
    branches: [p5, p6]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vllm
    steps:
      - uses: actions/checkout@v4
        with:
          path: vllm
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: zhangzhaoju/LMCache-dual
          ref: p6
          path: LMCache
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Host-only dependencies (no torch or CANN)
        run: python -m pip install pytest==9.0.2 numpy==1.26.4 msgspec==0.20.0 pyzmq==27.1.0 pydantic==2.12.5 setuptools==79.0.1 sphinx==7.2.6
      - run: python -B tools/run_layout_host_checks.py
